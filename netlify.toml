# ========================================================
# SemesterOS — Netlify Configuration
# Production build & SPA routing configuration
# ========================================================

[build]
  command = "npm run build"
  publish = "dist"

# Single Page Application (SPA) redirect rule
# Ensures refreshing on any route resolves correctly to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Custom cache headers for PWA Service Worker (always fresh)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Cache immutable bundled assets for high performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
